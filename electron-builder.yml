appId: com.corkboard.app
productName: Corkboard
directories:
  output: dist
  buildResources: build
files:
  - out/**
  # The window icon: index.ts loads it from ../../build/icon.png.
  - build/icon.png
# The GPL travels with every build: Corkboard's LICENSE beside the executable, next to Electron's
# LICENSE.electron.txt and LICENSES.chromium.html.
extraFiles:
  - from: LICENSE
    to: LICENSE
# node-pty is an N-API addon, so it never needs compiling against Electron's headers: Windows
# and macOS use its prebuilds, Linux the pty.node that `npm install` compiled.
npmRebuild: false
# node-pty starts conpty.dll, OpenConsole.exe and winpty-agent.exe from its own folder, and a
# native addon can't load from inside the asar archive on any platform.
asarUnpack:
  - node_modules/node-pty/**
# Releases live on GitHub. A `v*` tag makes CI build every package and upload it to a draft
# release (.github/workflows/release.yml); the apps only see it once the draft is published. Every
# package also carries this as resources/app-update.yml, which tells the in-app updater where to
# look. The local `npm run dist*` scripts never publish.
publish:
  provider: github
  owner: agaudreau1997
  repo: corkboard
  releaseType: draft
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# rpmbuild links every ELF file it packages under /usr/lib/.build-id, by build id. Electron's own
# files (chrome-sandbox, ...) are byte for byte those of other Electron apps packaged the same way,
# and dnf refuses two packages owning one link: the rpm built on Ubuntu wouldn't install beside
# Slack's. No links, then.
rpm:
  fpm:
    - --rpm-rpmbuild-define=_build_id_links none
linux:
  icon: build/icon.png
  category: Development
  # The binary, its .desktop file (corkboard.desktop) and the Wayland app id match package.json's
  # desktopName, which is how the taskbar finds the icon.
  executableName: corkboard
  synopsis: Kanban and mind map of git-backed task boards, handed to Claude Code
  desktop:
    entry:
      StartupWMClass: corkboard
  # `npm run dist:linux`: one file that runs on any distribution (needs FUSE 2, fuse-libs on
  # Fedora). `npm run dist:linux:rpm` builds an rpm instead (installs under /opt with a menu entry
  # and icons); electron-builder's bundled fpm needs libcrypt.so.1 for that, which Fedora ships in
  # libxcrypt-compat.
  target:
    - AppImage
  files:
    # Linux runs the pty.node `npm install` compiled: leave out the Windows and macOS builds and
    # the Windows console sources (58 MB of node-pty's 63).
    - "!node_modules/node-pty/prebuilds/**"
    - "!node_modules/node-pty/third_party/**"
    - "!node_modules/node-pty/deps/**"
